<button type="button" id="ohp-launcher" aria-haspopup="dialog" aria-controls="ohp-chat">Message the office</button>
<dialog id="ohp-chat" aria-labelledby="ohp-title" data-origin="">
  <div class="bar">
    <div>
      <h2 id="ohp-title">Ohana Properties</h2>
      <p class="meta" id="ohp-presence" style="margin:.15rem 0 0"><span class="dot" id="ohp-dot"></span><span id="ohp-who">Choose who to reach</span></p>
    </div>
    <button type="button" class="quiet" id="ohp-close" style="color:#f6f1e8">Close</button>
  </div>
  <div class="body">
    <div id="ohp-home" class="choice">
      <p style="margin:0">A private chat with the office, or the after-hours specialist. A room is only you and one other person.</p>
      <button type="button" data-desk="leasing"><strong>Leasing</strong><br><span class="meta">Ask about a vacancy on this page or applying to rent</span></button>
      <button type="button" data-desk="maintenance"><strong>Maintenance</strong><br><span class="meta">Write the office about a repair or an owner question</span></button>
      <button type="button" data-desk="specialist"><strong>24-hour specialist</strong><br><span class="meta">Answers from this page's notes, any time</span></button>
      <p class="meta">Or call (714) 213-8493.</p>
    </div>
    <div id="ohp-room" hidden style="display:flex;flex-direction:column;gap:.6rem;height:100%">
      <button type="button" class="quiet" id="ohp-back">Back</button>
      <div id="ohp-log" class="log" aria-live="polite"></div>
      <p id="ohp-typing" class="meta" hidden></p>
      <form id="ohp-form" class="row">
        <label class="meta" style="position:absolute;left:-999px" for="ohp-box">Message</label>
        <input id="ohp-box" maxlength="1500" placeholder="Write a message" autocomplete="off">
        <button class="go" type="submit">Send</button>
      </form>
    </div>
  </div>
</dialog>
