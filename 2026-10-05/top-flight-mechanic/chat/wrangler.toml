name = "top-flight-mechanic-chat"
main = "src/index.ts"
compatibility_date = "2026-09-01"

[ai]
binding = "AI"

[[durable_objects.bindings]]
name = "CHAT"
class_name = "ChatRoom"

[[durable_objects.bindings]]
name = "INBOX"
class_name = "Inbox"

[[durable_objects.bindings]]
name = "SUPPORT"
class_name = "SupportRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ChatRoom", "Inbox", "SupportRoom"]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
