<button type="button" id="nps-launcher" aria-haspopup="dialog" aria-controls="nps-chat">Message the office</button>
<dialog id="nps-chat" aria-labelledby="nps-title" data-origin="">
  <div class="bar">
    <div>
      <h2 id="nps-title">Nath Property Solutions</h2>
      <p class="meta" id="nps-presence" style="margin:.15rem 0 0"><span class="dot" id="nps-dot"></span><span id="nps-who">Choose who to reach</span></p>
    </div>
    <button type="button" class="quiet" id="nps-close" style="color:#f3f6fa">Close</button>
  </div>
  <div class="body">
    <div id="nps-home" class="choice">
      <p style="margin:0">A private chat with the office, or the after-hours specialist. A room is only you and one other person.</p>
      <button type="button" data-desk="leasing"><strong>Leasing</strong><br><span class="meta">Ask about a community on this page or applying to rent</span></button>
      <button type="button" data-desk="maintenance"><strong>Maintenance</strong><br><span class="meta">Write the office about a repair or an owner question</span></button>
      <button type="button" data-desk="specialist"><strong>24-hour specialist</strong><br><span class="meta">Answers from this page's notes, any time</span></button>
      <p class="meta">Or call (714) 409-0440.</p>
    </div>
    <div id="nps-room" hidden style="display:flex;flex-direction:column;gap:.6rem;height:100%">
      <button type="button" class="quiet" id="nps-back">Back</button>
      <div id="nps-log" class="log" aria-live="polite"></div>
      <p id="nps-typing" class="meta" hidden></p>
      <form id="nps-form" class="row">
        <label class="meta" style="position:absolute;left:-999px" for="nps-box">Message</label>
        <input id="nps-box" maxlength="1500" placeholder="Write a message" autocomplete="off">
        <button class="go" type="submit">Send</button>
      </form>
    </div>
  </div>
</dialog>
