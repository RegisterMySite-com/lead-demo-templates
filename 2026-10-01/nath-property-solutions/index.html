<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nath Property Solutions — loading</title></head>
<body>
<script src="photos/nath-page-0.js"></script>
<script src="photos/nath-page-1.js"></script>
<script src="photos/nath-page-2.js"></script>
<script src="photos/nath-page-3.js"></script>
<script src="photos/nath-page-4.js"></script>
<script>
(async()=>{
  const parts=window.NATH_PAGE_PARTS||[];
  const B64=parts.join("");
  if(!B64){document.body.textContent="Demo payload missing.";return;}
  const bin=Uint8Array.from(atob(B64),c=>c.charCodeAt(0));
  const ds=new DecompressionStream("gzip");
  const stream=new Blob([bin]).stream().pipeThrough(ds);
  const text=await new Response(stream).text();
  document.open();document.write(text);document.close();
})().catch(e=>{document.body.textContent="Demo failed to inflate: "+e;});
</script>
<noscript>Enable JavaScript to view this concept demo.</noscript>
</body></html>
