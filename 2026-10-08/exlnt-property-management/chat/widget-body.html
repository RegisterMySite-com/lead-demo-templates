<button type="button" id="exl-launcher" aria-haspopup="dialog" aria-controls="exl-chat">Message the office</button>
<dialog id="exl-chat" aria-labelledby="exl-title" data-origin="">
  <div class="bar">
    <div>
      <h2 id="exl-title">EXLNT Property Management</h2>
      <p class="meta" id="exl-presence" style="margin:.15rem 0 0"><span class="dot" id="exl-dot"></span><span id="exl-who">Choose who to reach</span></p>
    </div>
    <button type="button" class="quiet" id="exl-close" style="color:#fffdf8">Close</button>
  </div>
  <div class="body">
    <div id="exl-home" class="choice">
      <p style="margin:0">A private chat with the office, or the after-hours specialist. A room is only you and one other person.</p>
      <button type="button" data-desk="leasing"><strong>Leasing</strong><br><span class="meta">Ask about current availability, a rental inquiry, or the areas we serve</span></button>
      <button type="button" data-desk="maintenance"><strong>Maintenance</strong><br><span class="meta">Write the office about a repair, or an owner question</span></button>
      <button type="button" data-desk="specialist"><strong>24-hour specialist</strong><br><span class="meta">Answers from this page's notes, any time</span></button>
      <p class="meta">Or call (562) 868-0986.</p>
    </div>
    <div id="exl-room" hidden style="display:flex;flex-direction:column;gap:.6rem;height:100%">
      <button type="button" class="quiet" id="exl-back">Back</button>
      <div id="exl-log" class="log" aria-live="polite"></div>
      <p id="exl-typing" class="meta" hidden></p>
      <form id="exl-form" class="row">
        <label class="meta" style="position:absolute;left:-999px" for="exl-box">Message</label>
        <input id="exl-box" maxlength="1500" placeholder="Write a message" autocomplete="off">
        <button class="go" type="submit">Send</button>
      </form>
    </div>
  </div>
</dialog>
