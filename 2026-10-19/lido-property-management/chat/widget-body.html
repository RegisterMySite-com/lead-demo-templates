<button type="button" id="lpm-launcher" aria-haspopup="dialog" aria-controls="lpm-chat">Message the office</button>
<dialog id="lpm-chat" aria-labelledby="lpm-title" data-origin="">
  <div class="bar">
    <div>
      <h2 id="lpm-title">Lido Property Management</h2>
      <p class="meta" id="lpm-presence" style="margin:.15rem 0 0"><span class="dot" id="lpm-dot"></span><span id="lpm-who">Choose who to reach</span></p>
    </div>
    <button type="button" class="quiet" id="lpm-close" style="color:#fffdf8">Close</button>
  </div>
  <div class="body">
    <div id="lpm-home" class="choice">
      <p style="margin:0">A private chat with the office, or the after-hours specialist. A room is only you and one other person.</p>
      <button type="button" data-desk="leasing"><strong>Leasing</strong><br><span class="meta">Ask about our 20 available apartments, applying, or a showing</span></button>
      <button type="button" data-desk="maintenance"><strong>Maintenance</strong><br><span class="meta">Write the office about a repair, or an owner question</span></button>
      <button type="button" data-desk="specialist"><strong>24-hour specialist</strong><br><span class="meta">Answers from this page's notes, any time</span></button>
      <p class="meta">Or call (714) 956-0235.</p>
    </div>
    <div id="lpm-room" hidden style="display:flex;flex-direction:column;gap:.6rem;height:100%">
      <button type="button" class="quiet" id="lpm-back">Back</button>
      <div id="lpm-log" class="log" aria-live="polite"></div>
      <p id="lpm-typing" class="meta" hidden></p>
      <form id="lpm-form" class="row">
        <label class="meta" style="position:absolute;left:-999px" for="lpm-box">Message</label>
        <input id="lpm-box" maxlength="1500" placeholder="Write a message" autocomplete="off">
        <button class="go" type="submit">Send</button>
      </form>
    </div>
  </div>
</dialog>
