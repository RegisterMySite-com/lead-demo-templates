<button type="button" id="lsp-launcher" aria-haspopup="dialog" aria-controls="lsp-chat">Message the office</button>
<dialog id="lsp-chat" aria-labelledby="lsp-title" data-origin="">
  <div class="bar">
    <div>
      <h2 id="lsp-title">LS Property Management</h2>
      <p class="meta" id="lsp-presence" style="margin:.15rem 0 0"><span class="dot" id="lsp-dot"></span><span id="lsp-who">Choose who to reach</span></p>
    </div>
    <button type="button" class="quiet" id="lsp-close" style="color:#fffdf8">Close</button>
  </div>
  <div class="body">
    <div id="lsp-home" class="choice">
      <p style="margin:0">A private chat with the office, or the after-hours specialist. A room is only you and one other person.</p>
      <button type="button" data-desk="leasing"><strong>Leasing</strong><br><span class="meta">Ask about our available house, applying, or the areas we serve</span></button>
      <button type="button" data-desk="maintenance"><strong>Maintenance</strong><br><span class="meta">Write the office about a repair, or an owner question</span></button>
      <button type="button" data-desk="specialist"><strong>24-hour specialist</strong><br><span class="meta">Answers from this page's notes, any time</span></button>
      <p class="meta">Or call (562) 696-7001.</p>
    </div>
    <div id="lsp-room" hidden style="display:flex;flex-direction:column;gap:.6rem;height:100%">
      <button type="button" class="quiet" id="lsp-back">Back</button>
      <div id="lsp-log" class="log" aria-live="polite"></div>
      <p id="lsp-typing" class="meta" hidden></p>
      <form id="lsp-form" class="row">
        <label class="meta" style="position:absolute;left:-999px" for="lsp-box">Message</label>
        <input id="lsp-box" maxlength="1500" placeholder="Write a message" autocomplete="off">
        <button class="go" type="submit">Send</button>
      </form>
    </div>
  </div>
</dialog>
